name: Release

# On every push to main:
# - with pending changesets, opens (or updates) the "Version packages" pull request;
# - once that pull request is merged, builds and publishes the new versions to npm with trusted
#   publishing (no npm token), then pushes the git tags and creates the GitHub releases.
# npm trusts this file by name: renaming it breaks publishing (see "Releases" in Readme.md).
on:
    push:
        branches:
            - main

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    select-mode:
        name: Select mode
        runs-on: ubuntu-24.04
        outputs:
            mode: ${{ steps.select-mode.outputs.mode }}
            publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci

            - name: Select mode
              id: select-mode
              uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

    version:
        name: Version packages
        if: needs.select-mode.outputs.mode == 'version'
        needs: select-mode
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci

            - name: Open or update the "Version packages" pull request
              uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  script: npm run version-packages
                  commit-message: Version packages
                  pr-title: Version packages

    pack:
        name: Build and pack
        if: needs.select-mode.outputs.mode == 'publish'
        needs: select-mode
        runs-on: ubuntu-24.04
        outputs:
            pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci

            # changeset pack runs npm pack, which doesn't run the prepublishOnly scripts
            - name: Build packages
              run: npm run build

            - name: Pack packages
              id: pack
              uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

    publish:
        name: Publish to npm
        needs: pack
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci

            - name: Publish packages
              uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
